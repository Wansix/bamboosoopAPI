runners:
  - type: python
    build:
      steps:
        - name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_14.x | bash -
            apt-get install -y nodejs
        - name: Install Heroku Node.js buildpack
          command: |
            curl https://buildpack-registry.s3.amazonaws.com/buildpacks/heroku/nodejs.tgz | tar xz -C /tmp
            koyeb buildpacks:add /tmp/heroku-nodejs-master
        - name: Build Node.js application
          command: |
            cd /app
            npm install
            npm run build
        - name: Start Node.js application
          command: npm start
